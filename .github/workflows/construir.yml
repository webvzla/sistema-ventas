name: Publicar web (versión real)

# Publica la web real (stocksoft.web.app) al subir a main, con el código ofuscado y el último
# instalador en /updates/. La app de PC carga esta web desde internet, así que estos cambios les
# llegan a los clientes sin ningún aviso de actualización. El instalador va aparte (instalador.yml).
on:
  push:
    branches: [main]
    paths-ignore: ['web/tasas.json']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: construir
  cancel-in-progress: true

jobs:
  firebase:
    name: Sitio stocksoft.web.app
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npm run vendor && bash scripts/publicar-sitio.sh
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: sistema-ventas-e085f
          channelId: live
