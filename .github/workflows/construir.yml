name: Construir app de PC y versión web

on:
  push:
    branches: [main]
    paths-ignore: ['web/tasas.json']
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: construir
  cancel-in-progress: true

jobs:
  web:
    name: Versión web (móvil)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npm run vendor
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4

  windows:
    name: Instalador de Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Versión
        shell: bash
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version
      - name: Construir y publicar (con actualización automática)
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: dist/*.exe

  firebase:
    name: Sitio stocksoft.web.app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ¿Está configurada la clave de Firebase?
        id: key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$SA" ]; then echo "ok=true" >> $GITHUB_OUTPUT; else echo "ok=false" >> $GITHUB_OUTPUT; echo "Falta el secreto FIREBASE_SERVICE_ACCOUNT, no se publica en stocksoft.web.app"; fi
      - if: steps.key.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: steps.key.outputs.ok == 'true'
        run: npm install --no-audit --no-fund --ignore-scripts
      - if: steps.key.outputs.ok == 'true'
        run: npm run vendor && bash scripts/build-site.sh
      - if: steps.key.outputs.ok == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: sistema-ventas-e085f
          channelId: live
      # Reglas de seguridad de Firestore (firestore.rules) publicadas con la misma clave.
      - name: Publicar reglas de Firestore
        if: steps.key.outputs.ok == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only firestore:rules --project sistema-ventas-e085f --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
