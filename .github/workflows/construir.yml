name: Construir app de PC y versión web

on:
  push:
    branches: [main]
    paths-ignore: ['web/tasas.json']
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: construir
  cancel-in-progress: true

jobs:
  web:
    name: Versión web (móvil)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npm run vendor
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4

  windows:
    name: Instalador de Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: dist/*.exe
      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Sistema de Ventas v1.0.${{ github.run_number }}
          body: |
            Descarga **Sistema-de-Ventas-Setup-*.exe**, ábrelo e instálalo.
            Si Windows muestra "Windows protegió su PC", pulsa "Más información" → "Ejecutar de todos modos".
          files: dist/*.exe
          make_latest: true
