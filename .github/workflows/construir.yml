name: Construir app de PC y versión web

on:
  push:
    branches: [main]
    paths-ignore: ['web/tasas.json']
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: construir
  cancel-in-progress: true

jobs:
  web:
    name: Versión web (móvil)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npm run vendor
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4

  windows:
    name: Instalador de Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Versión
        shell: bash
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version
      - name: Construir y publicar (con actualización automática)
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: dist/*.exe
