name: Actualizar tasas BCV

on:
  schedule:
    - cron: '17 */2 * * *'   # cada 2 horas
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tasas
  cancel-in-progress: false

jobs:
  tasas:
    runs-on: ubuntu-latest
    env:
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Consultar BCV
        run: node scripts/tasas.js
      - name: Guardar si cambió
        id: commit
        run: |
          if git diff --quiet web/tasas.json; then echo "changed=false" >> $GITHUB_OUTPUT; exit 0; fi
          git config user.name "tasas-bcv"
          git config user.email "actions@users.noreply.github.com"
          git add web/tasas.json
          git commit -m "Tasa BCV $(date -u +%Y-%m-%dT%H:%M)"
          git push
          echo "changed=true" >> $GITHUB_OUTPUT
      # La tasa nueva en stocksoft.web.app (la app la lee de /app/tasas.json).
      - if: steps.commit.outputs.changed == 'true' && env.SA != ''
        run: npm install --no-audit --no-fund --ignore-scripts && npm run vendor && bash scripts/publicar-sitio.sh
      - if: steps.commit.outputs.changed == 'true' && env.SA != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: sistema-ventas-e085f
          channelId: live
