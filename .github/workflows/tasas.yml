name: Actualizar tasas BCV

on:
  schedule:
    - cron: '17 */2 * * *'   # cada 2 horas
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tasas:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Consultar BCV
        run: node scripts/tasas.js
      - name: Guardar si cambió
        id: commit
        run: |
          if git diff --quiet web/tasas.json; then echo "changed=false" >> $GITHUB_OUTPUT; exit 0; fi
          git config user.name "tasas-bcv"
          git config user.email "actions@users.noreply.github.com"
          git add web/tasas.json
          git commit -m "Tasa BCV $(date -u +%Y-%m-%dT%H:%M)"
          git push
          echo "changed=true" >> $GITHUB_OUTPUT
      - if: steps.commit.outputs.changed == 'true'
        run: npm install --no-audit --no-fund --ignore-scripts
      - if: steps.commit.outputs.changed == 'true'
        run: npm run vendor
      - if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
